 st.innerHTML=h+"</div></div>";
 st.querySelectorAll("button").forEach(function(b){
  b.onclick=function(){pts+=q.o[+b.dataset.i][1];step++;render();};
 });
}

 if(pts<=3)return{emoji:"🔬",t:"AUFGEKLÄRT (Level 0–3)",d:"Du bist so schwurbelig wie ein Laborkittel. Respekt! Dein Gag-Potenzial: Schenk anderen Aufklärung — verpackt als Witz.",sku:"SC-003",pn:"5G-Harmonisierer „FunkFrieden“",fakt:"Fakt: 5G-Strahlung liegt unterhalb der Grenzwerte — die Photonenenergie reicht schlicht nicht, um DNA aufzubrechen."};

 st.innerHTML='<div class="result"><div class="fig">'+L.emoji+'</div><h2>'+L.t+'</h2><p>'+pts+'/15 Punkte</p>'

+'<p class="shop-link">Nochmal? <a href="#" id="again">Quiz wiederholen ↻</a> · <a href="/">Alle 15 Produkte im Shop →</a></p></div>';
 document.getElementById("copy").onclick=function(){
  var t=document.getElementById("sharetext").innerText;
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(function(){document.getElementById("copy").innerText="✅ Kopiert!";});}

 };
 document.getElementById("again").onclick=function(e){e.preventDefault();step=0;pts=0;render();}; document.getElementById("nlform").onsubmit=function(e){e.preventDefault();

 };
